name: Deploy static site to IPFS

on:
  workflow_run:
    workflows: ["Reconcile smart contracts"]
    types: [completed]
    branches:
      - develop
      - release

  # Allow manual re-runs (e.g. after fixing a Pinata issue)
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build and deploy"
        required: false
        default: "release"

permissions:
  contents: write

# Prevent parallel deploys
concurrency:
  group: site-deploy-${{ github.event.workflow_run.head_branch || inputs.branch || 'release' }}
  cancel-in-progress: false

env:
  DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || inputs.branch || 'release' }}

jobs:
  build:
    # Only deploy the site if the contract deploy succeeded,
    # or if this workflow was triggered manually.
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Configure frontend deployment environment
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          DEVELOPMENT_SEARCH_URL: ${{ vars.DEVELOPMENT_SEARCH_URL }}
          PRODUCTION_SEARCH_URL: ${{ vars.PRODUCTION_SEARCH_URL }}
        run: |
          case "${DEPLOY_BRANCH}" in
            develop)
              if [ -z "${BASE_SEPOLIA_RPC_URL}" ]; then
                echo "BASE_SEPOLIA_RPC_URL secret is required for develop site deployment."
                exit 1
              fi
              if [ -z "${DEVELOPMENT_SEARCH_URL}" ]; then
                echo "DEVELOPMENT_SEARCH_URL repository variable is required for develop site deployment."
                exit 1
              fi
              echo "VITE_NETWORK=base_sepolia" >> "${GITHUB_ENV}"
              echo "VITE_REGISTRY_MODE=mocked" >> "${GITHUB_ENV}"
              echo "VITE_BASE_SEPOLIA_RPC_URL=${BASE_SEPOLIA_RPC_URL}" >> "${GITHUB_ENV}"
              echo "VITE_SEARCH_URL=${DEVELOPMENT_SEARCH_URL}" >> "${GITHUB_ENV}"
              ;;
            release)
              if [ -z "${BASE_RPC_URL}" ]; then
                echo "BASE_RPC_URL secret is required for release site deployment."
                exit 1
              fi
              if [ -z "${PRODUCTION_SEARCH_URL}" ]; then
                echo "PRODUCTION_SEARCH_URL repository variable is required for release site deployment."
                exit 1
              fi
              echo "VITE_NETWORK=base" >> "${GITHUB_ENV}"
              echo "VITE_REGISTRY_MODE=production" >> "${GITHUB_ENV}"
              echo "VITE_BASE_RPC_URL=${BASE_RPC_URL}" >> "${GITHUB_ENV}"
              echo "VITE_SEARCH_URL=${PRODUCTION_SEARCH_URL}" >> "${GITHUB_ENV}"
              ;;
            *)
              echo "Unsupported site deployment branch: ${DEPLOY_BRANCH}"
              exit 1
              ;;
          esac

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  pin-ipfs:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      cid: ${{ steps.pin.outputs.cid }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Pin to IPFS
        id: pin
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_GATEWAY: ${{ secrets.PINATA_GATEWAY }}
        run: npx tsx scripts/pin-to-ipfs.ts dist

  publish-release:
    needs: pin-ipfs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CID: ${{ needs.pin-ipfs.outputs.cid }}
          PINATA_GATEWAY: ${{ secrets.PINATA_GATEWAY }}
        run: |
          TAG="site-${DEPLOY_BRANCH}-$(date -u +%Y%m%d-%H%M%S)"
          GATEWAY="https://${PINATA_GATEWAY}/ipfs/${CID}"
          PUBLIC="https://ipfs.io/ipfs/${CID}"

          gh release create "$TAG" \
            --title "Site Deployment — ${TAG}" \
            --notes "## Frontend deployed to IPFS

          **CID:** \`${CID}\`

          **Access the site:**
          - [Pinata Gateway](${GATEWAY})
          - [Public Gateway](${PUBLIC})
          - Local IPFS node: \`ipfs cat ${CID}\`"
