services:
  hardhat_forked:
    profiles:
      - forked
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      - SEPOLIA_RPC_URL
      - SEPOLIA_DEPLOYER_PRIVATE_KEY
    volumes:
      - ./blockchain:/app
    ports:
      - "8545:8545"
    command: sh -c "npm install && npx hardhat node --network local_sepolia_fork"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8545" ]
      interval: 30s
      retries: 3
      timeout: 2s
      start_period: 2m
      # start_interval: 5s
  hardhat_mocked:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./blockchain:/app
    ports:
      - "8545:8545"
    command: sh -c "npm install && npx hardhat node"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8545" ]
      interval: 30s
      retries: 3
      timeout: 2s
      start_period: 2m
      # start_interval: 5s
  contract_deployer:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./blockchain:/app
      - ./frontend:/frontend
    environment:
      - DEPLOY_MODE=mock
    depends_on:
      hardhat_mocked:
        condition: service_healthy
    command: sh -c " npm install && rm -rf ignition/deployments/chain-31337 && npx hardhat clean && npx hardhat compile && npx hardhat run scripts/deploy.ts --network compose_hardhat"
  frontend:
    profiles:
      - dev
    image: node:24-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./frontend/src/contracts.ts:/app/src/contracts.ts
    ports:
      - "5173:5173"
    depends_on:
      hardhat_mocked:
        condition: service_healthy
    command: sh -c "npm install && npm run dev -- --host"
  meilisearch:
    image: getmeili/meilisearch:v1.12
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: "dev-master-key"
      MEILI_ENV: "development"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7700/health" ]
      interval: 15s
      retries: 3
      timeout: 2s
      start_period: 10s
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      - MEILI_URL=http://meilisearch:7700
      - MEILI_API_KEY=dev-master-key
      - FORUM_CONTRACT_ADDRESS=${FORUM_CONTRACT_ADDRESS:-0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0}
      - ETHEREUM_NODE_URL=ws://hardhat_mocked:8545
    ports:
      - "8000:8000"
    depends_on:
      meilisearch:
        condition: service_healthy
      contract_deployer:
        condition: service_completed_successfully
    command: sh -c " python -m venv .venv || true && . .venv/bin/activate && python -m pip install uv && python -m uv pip sync requirements.txt && uvicorn ourvoice.combined:app --host 0.0.0.0 --port 8000 --app-dir src"
