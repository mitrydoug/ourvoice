services:
  frontend:
    image: node:25-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
  hardhat_node:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./blockchain:/app
    expose:
      - "8545"
    ports:
      - "8545:8545"
    command: sh -c "npm install && npx hardhat node"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 10s
      timeout: 5s
      retries: 5
  smart_contracts:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./blockchain:/app
    command: sh -c "npm install && npx hardhat run scripts/deploy.ts --network compose_hardhat"
    depends_on:
      hardhat_node:
        condition: service_healthy