services:
  meilisearch:
    image: getmeili/meilisearch:v1.12
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: "dev-master-key"
      MEILI_ENV: "development"
    tmpfs:
      - /meili_data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7700/health" ]
      interval: 15s
      retries: 3
      timeout: 2s
      start_period: 10s
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      - MEILI_URL=http://meilisearch:7700
      - MEILI_API_KEY=dev-master-key
      - FORUM_CONTRACT_ADDRESSES=${FORUM_CONTRACT_ADDRESSES:-}
      - BACKFILL_FROM=${BACKFILL_FROM:-all}
      - CORS_ORIGINS=*
    ports:
      - "8000:8000"
    depends_on:
      meilisearch:
        condition: service_healthy
    command: sh -c " python -m venv .venv || true && . .venv/bin/activate && python -m pip install uv && python -m uv pip sync requirements.txt && uvicorn ourvoice.combined:app --host 0.0.0.0 --port 8000 --app-dir src"
