services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - ./frontend/src/contracts.ts:/app/src/contracts.ts
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
  hardhat_node:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      - SEPOLIA_RPC_URL
      - SEPOLIA_PRIVATE_KEY
    volumes:
      - ./blockchain:/app
    expose:
      - "8545"
    ports:
      - "8545:8545"
    command: sh -c "npm install && npx hardhat node --network local_sepolia_fork"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 10s
      timeout: 5s
      retries: 5
  smart_contracts:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./blockchain:/app
      - ./frontend/:/frontend
    command: sh -c "npm install && npx hardhat ignition deploy ignition/modules/ForumForkedRegistry.ts --network compose_hardhat"
    depends_on:
      hardhat_node:
        condition: service_healthy